name: Deploy to VPS

# Manual-only for now (workflow_dispatch): it was auto-running on every
# push to main and failing every time, because the GitHub repository
# secrets it needs (VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_REPO_PATH) don't
# exist yet — see docs/operations/deploy.md. Once those are set and a
# manual run (Actions tab -> Deploy to VPS -> Run workflow) has been
# watched succeed at least once, restore the `push` trigger below:
#
# on:
#   push:
#     branches: [main]
#   workflow_dispatch: {}
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.VPS_PORT || '22' }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: git fetch + reset + scripts/deploy.sh on the VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.VPS_PORT || '22' }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "set -euo pipefail && cd '${{ secrets.VPS_REPO_PATH }}' && git fetch origin main && git reset --hard origin/main && ./scripts/deploy.sh"
